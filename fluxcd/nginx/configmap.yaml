apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: app
data:
  nginx.conf: |
    worker_processes auto;
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen 80;

        location / {
          return 200 "ok\n";
        }

        location /load {
          content_by_lua_block {
            local iterations = tonumber(ngx.var.arg_n) or 300000
            local x = 0
            for i = 1, iterations do
              x = x + math.sqrt(i) * math.sin(i)
            end
            ngx.say("done ", x)
          }
        }
      }
    }
